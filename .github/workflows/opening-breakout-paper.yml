name: opening-breakout-paper

on:
  schedule:
    - cron: "45 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Run Opening Breakout paper strategy
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python opening_breakout.py

      - name: Save updated logs
        run: |
          python3 - <<'PY'
          import pandas as pd, os
          p = "opening_breakout_trades.csv"
          if os.path.exists(p) and os.path.getsize(p) > 0:
              d = pd.read_csv(p)
              if "Trade_ID" in d.columns:
                  before = len(d)
                  d = d.drop_duplicates(subset="Trade_ID", keep="last")
                  d.to_csv(p, index=False)
                  print(f"Deduped: {before} -> {len(d)} rows")
          # summary of last run's new trades
          if os.path.exists(p) and os.path.getsize(p) > 0:
              d = pd.read_csv(p)
              print("Total trades in file:", len(d))
              if "PnL_Rs" in d.columns:
                  print("Cumulative PnL Rs:", round(d["PnL_Rs"].sum(), 2))
                  print("Win rate %:", round((d["PnL_Rs"] > 0).mean() * 100, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opening_breakout_trades.csv
          echo "last_run=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > opening_breakout_last_run.txt
          git add opening_breakout_last_run.txt
          git diff --cached --quiet || git commit -m "opening breakout paper run $(date -u +%F)"
          git push