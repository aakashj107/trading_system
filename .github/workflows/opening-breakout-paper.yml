name: opening-breakout-paper

on:
schedule:
# 17:15 IST = 11:45 UTC
# Gives the market-data provider some time after the close.
- cron: "45 11 * * 1-5"

workflow_dispatch:

permissions:
contents: write

jobs:
run:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      pip install yfinance pandas numpy requests

  - name: Run Opening Breakout paper strategy
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    run: |
      python opening_breakout.py

  - name: Save updated logs
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add opening_breakout_trades.csv

      git diff --cached --quiet || \
        git commit -m "opening breakout paper run $(date -u +%F)"

      git push
```
