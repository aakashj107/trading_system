name: Paper Trading Scan

on:
  schedule:
    - cron: '*/15 3-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp python-dotenv logzero websocket-client schedule requests pandas numpy pytz yfinance

      - name: Run paper trading scan
        run: python live_runner.py --universe core --regime BULL
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload cycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-logs-${{ github.run_number }}
          path: daily_logs/live_cycles_*.jsonl
          retention-days: 30
