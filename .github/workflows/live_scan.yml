name: Paper Trading Scan

on:
  schedule:
    # Single EOD run after market close (IST 15:45) - complete daily bars,
    # reliable on GitHub Actions (avoids 15-min throttling/delays).
    - cron: '15 10 * * 1-5'      # 15:45 IST Mon-Fri (EOD consensus scan)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore trading state (positions, logs)
        uses: actions/cache@v4
        with:
          path: |
            trade_logs
            live_state
          key: live-state-${{ github.run_id }}
          restore-keys: |
            live-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp python-dotenv logzero websocket-client schedule requests pandas numpy pytz yfinance

      - name: Validate config
        run: |
          python3 -c "
          from config import get_core_stocks, get_active_stocks, get_all_stocks, STOCK_UNIVERSE
          core = get_core_stocks()
          active = get_active_stocks()
          all_s = get_all_stocks()
          print(f'Config OK: {len(core)} core, {len(active)} active, {len(all_s)} total')
          assert len(core) >= 30, f'Too few core stocks: {len(core)}'
          assert len(active) >= 100, f'Active stocks missing: {len(active)}'
          print('All validations passed')
          "

      - name: Validate token cache
        run: |
          python3 -c "
          import json, os
          cache_file = 'token_cache.json'
          if os.path.exists(cache_file):
              with open(cache_file) as f:
                  cache = json.load(f)
              print(f'Token cache: {len(cache)} symbols cached')
              for sym, info in list(cache.items())[:5]:
                  print(f'  {sym}: token={info[\"token\"]}, tradingsymbol={info[\"tradingsymbol\"]}')
          else:
              print('No token cache found — will resolve via searchScrip')
          "

      - name: Detect market regime
        id: regime
        run: |
          REGIME=$(python3 -c "
          import contextlib, io
          buf = io.StringIO()
          try:
              with contextlib.redirect_stdout(buf):
                  from data_fetcher import YFinanceDataFetcher
                  from regime_detector import RegimeDetector
                  f = YFinanceDataFetcher(cache_dir='data_cache')
                  df = f.get_nifty_index(period='1y')
              r = RegimeDetector().detect(df) if (df is not None and not df.empty) else {}
              print(r.get('regime','BULL'))
          except Exception as e:
              print('BULL')
          ")
          echo "regime=$REGIME" >> $GITHUB_OUTPUT
          echo "Detected regime: $REGIME"

      - name: Run paper trading scan
        run: python live_runner.py --universe core --regime ${{ steps.regime.outputs.regime }}
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Trade summary
        if: always()
        run: |
          echo ""
          echo "============================================="
          echo "  PAPER TRADING RESULTS"
          echo "============================================="
          LOG="daily_logs/live_cycles_$(date -u +%Y-%m-%d).jsonl"
          if [ -f "$LOG" ]; then
            python3 -c "
          import json, sys
          for line in open('$LOG'):
              d = json.loads(line)
              print(f'  Cycle #{d[\"cycle\"]} | {d[\"status\"]}')
              print(f'  Scanned: {d.get(\"symbols_scanned\", 0)} stocks | Signals: {d.get(\"raw_signals\", 0)} | Consensus: {d.get(\"consensus_signals\", 0)}')
              print(f'  Buys: {d.get(\"buy_orders\", 0)} | Sells: {d.get(\"sell_orders\", 0)}')
              for e in d.get('executed', []):
                  print(f'  >> {e[\"signal\"]} {e[\"symbol\"]} @ ₹{e[\"price\"]:,.2f} x {e[\"quantity\"]} ({e[\"strength\"]})')
              print()
          "
          else
            echo "  No cycles yet"
          fi
          echo "============================================="
          echo ""
          echo "--- Signals CSV (last 5) ---"
          if [ -f trade_logs/signals.csv ]; then
            tail -5 trade_logs/signals.csv
          else
            echo "  No signals logged yet"
          fi
          echo ""
          echo "--- Trades CSV (last 5) ---"
          if [ -f trade_logs/trades.csv ]; then
            tail -5 trade_logs/trades.csv
          else
            echo "  No trades logged yet"
          fi

      - name: Daily report (job summary + console)
        if: always()
        run: |
          python3 daily_report.py | tee daily_report.md >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "--- Report also saved as artifact (daily_report.md) ---"

      - name: Save trade records to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p trade_logs daily_logs live_state
          git add trade_logs/ daily_logs/ live_state/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "live scan records $(date -u +%Y-%m-%dT%H:%M)Z" || true
            git push || echo "push failed (non-fatal; records remain in this run's artifact)"
          else
            echo "No new trade records this run."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-logs-${{ github.run_number }}
          path: |
            daily_logs/live_cycles_*.jsonl
            trade_logs/*.csv
            daily_report.md
          retention-days: 30
