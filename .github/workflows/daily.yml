name: daily-paper-run
on:
  schedule:
    - cron: '30 11 * * 1-5'    # 17:00 IST Mon–Fri (UTC+5:30 fixed, no DST)
  workflow_dispatch:            # manual "Run" button for testing
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy requests
      - run: python daily_run.py
      - name: Save updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals_log.csv paper_trades.csv
          # Always leave an audit trail even when no signals/trades were generated
          echo "last_run=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > daily_run_last_run.txt
          git add daily_run_last_run.txt
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git push